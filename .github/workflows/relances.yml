name: Relances de paiement

# Relance (une seule fois) les clients qui n'ont pas terminé leur paiement.
# Vercel Hobby n'autorise qu'une tâche planifiée par jour (vercel.json) : ce
# workflow appelle la même route toutes les 15 minutes, pour que la relance
# parte environ 1 h après la commande. La route est idempotente (une relance par
# commande) et protégée par CRON_SECRET, qui doit être IDENTIQUE ici (secret du
# dépôt) et dans les variables d'environnement Vercel.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: relances
  cancel-in-progress: false

permissions: {}

jobs:
  relances:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Lancer les relances
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          response=$(curl --silent --show-error --fail --max-time 90 --retry 2 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "https://www.reference-informatique.com/api/cron/relances")
          echo "$response"
          if echo "$response" | grep -q '"disabled":true'; then
            echo "::warning::CRON_SECRET n'est pas défini sur Vercel : les relances sont désactivées."
          fi
