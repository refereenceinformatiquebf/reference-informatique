name: Relances de paiement

# Relance (une seule fois) les clients qui n'ont pas terminé leur paiement.
# Vercel Hobby n'autorise qu'une tâche planifiée par jour (vercel.json) : ce
# workflow appelle la même route à 9 h, 13 h et 19 h. Chaque passage relance les
# commandes en attente depuis au moins 1 h. Les heures sont en UTC, soit l'heure
# locale du Burkina Faso, de la Côte d'Ivoire, du Sénégal et du Mali. La route
# est idempotente (une relance par commande) et protégée par CRON_SECRET, qui
# doit être IDENTIQUE ici (secret du dépôt) et dans les variables
# d'environnement Vercel.
on:
  schedule:
    - cron: "3 9,13,19 * * *"
  workflow_dispatch:

concurrency:
  group: relances
  cancel-in-progress: false

permissions: {}

jobs:
  relances:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Lancer les relances
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          response=$(curl --silent --show-error --fail --max-time 90 --retry 2 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "https://www.reference-informatique.com/api/cron/relances")
          echo "$response"
          if echo "$response" | grep -q '"disabled":true'; then
            echo "::warning::CRON_SECRET n'est pas défini sur Vercel : les relances sont désactivées."
          fi
